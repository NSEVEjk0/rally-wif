name: Verify Rally
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: mkdir -p reports
      - run: forge test --root contracts --no-match-contract WIFForkTest -vv | tee reports/contract-tests.txt
      - run: forge test --root contracts --match-contract WIFForkTest -vvvv | tee reports/real-wif-fork.txt
        env:
          RALLY_FORK: "true"
      - run: node scripts/sync-abi.mjs --check
      - run: npm ci --no-audit --no-fund
      - name: Prepare exact compiler artifact for launch verification
        run: |
          npm run prepare:launch -- --out reports/launch-review.json
          npm run prepare:launch -- --check
      - run: npm run test:launch
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Start isolated wallet test chain
        run: nohup anvil --host 127.0.0.1 --port 8545 --chain-id 4663 --block-time 1 > reports/anvil.log 2>&1 &
      - name: Configure isolated mock-token deployment
        run: node scripts/seed-test-chain.mjs
      - name: Test actual browser wallet signing and refund path
        run: npm run test:browser -- tests/browser/wallet.spec.ts tests/browser/launch.spec.ts
        env:
          RALLY_LOCAL_CHAIN: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rally-verification
          path: |
            package-lock.json
            reports
            test-results
          retention-days: 7
